<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Терминал: С Днём Рождения, Друг!</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' font-size='80' text-anchor='middle' dy='.35em'%3E📟%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fira Code', 'Courier New', 'JetBrains Mono', monospace;
            padding: 20px;
        }

        .terminal {
            background-color: #0c0c0c;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #1a3a1a, 0 0 0 5px #050505;
            width: 100%;
            max-width: 950px;
            overflow: hidden;
        }

        .terminal-bar {
            background: #1a1a1a;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2a6e2a;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .win-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }
        .close { background: #ff5f56; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #27c93f; }

        .terminal-title {
            color: #4caf50;
            font-size: 0.8rem;
            letter-spacing: 1px;
            flex: 1;
            text-align: center;
        }
        .terminal-title span {
            background: #1a2a1a;
            padding: 2px 12px;
            border-radius: 20px;
        }

        .access-screen {
            background: #0a0a0a;
            padding: 35px 25px;
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .access-screen h3 {
            color: #33ff33;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-family: monospace;
        }

        .access-screen p {
            color: #88ff88;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .code-input {
            background: #0a0a0a;
            border: 2px solid #33ff33;
            color: #33ff33;
            font-family: 'Fira Code', monospace;
            font-size: 1.5rem;
            padding: 12px 20px;
            width: 280px;
            text-align: center;
            border-radius: 8px;
            outline: none;
        }

        .code-input::placeholder {
            color: #2a5a2a;
            font-size: 0.9rem;
        }

        .unlock-btn {
            background: #1a2a1a;
            border: 1px solid #33ff33;
            color: #33ff33;
            font-family: monospace;
            font-size: 1rem;
            padding: 10px 28px;
            margin-top: 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .unlock-btn:hover {
            background: #2a4a2a;
            box-shadow: 0 0 8px #33ff33;
        }

        .error-msg {
            color: #ff4444;
            margin-top: 15px;
            font-size: 0.8rem;
            min-height: 40px;
            font-family: monospace;
        }

        .hint {
            color: #4a8a4a;
            margin-top: 20px;
            font-size: 0.7rem;
            border-top: 1px solid #2a6e2a;
            padding-top: 18px;
        }

        .hidden {
            display: none;
        }

        .terminal-body {
            background: #0a0a0a;
            padding: 20px 22px 25px 22px;
            min-height: 500px;
            max-height: 65vh;
            overflow-y: auto;
            color: #33ff33;
            font-size: 0.95rem;
            line-height: 1.5;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .line {
            font-family: 'Fira Code', 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            border-left: 2px solid #33ff33;
            padding-left: 10px;
            margin-bottom: 2px;
        }

        .prompt {
            color: #33ff33;
            font-weight: bold;
        }

        .cmd {
            color: #55ff55;
        }

        .output {
            color: #88ff88;
            margin-bottom: 2px;
        }

        .ascii-art {
            color: #66ff66;
            font-size: 0.7rem;
            line-height: 1.3;
            white-space: pre;
            font-family: monospace;
            margin: 8px 0;
        }

        .input-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
            border-top: 1px solid #2a6e2a;
            padding-top: 14px;
        }

        .input-prompt {
            color: #33ff33;
            font-weight: bold;
            font-size: 1rem;
        }

        #user-input {
            background: transparent;
            border: none;
            color: #33ff33;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.95rem;
            flex: 1;
            outline: none;
            caret-color: #33ff33;
            min-width: 140px;
        }

        #user-input::placeholder {
            color: #2a5a2a;
            font-style: italic;
        }

        .send-btn {
            background: #1a2a1a;
            border: 1px solid #33ff33;
            color: #33ff33;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            background: #2a4a2a;
            color: #aaffaa;
            box-shadow: 0 0 6px #33ff33;
        }

        .help-note {
            font-size: 0.7rem;
            color: #4a8a4a;
            margin-top: 10px;
            text-align: right;
        }

        .terminal-body::-webkit-scrollbar {
            width: 6px;
        }
        .terminal-body::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: #33ff33;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="terminal" id="terminalRoot">
    <div class="terminal-bar">
        <div class="window-controls">
            <div class="win-btn close"></div>
            <div class="win-btn minimize"></div>
            <div class="win-btn maximize"></div>
        </div>
        <div class="terminal-title"><span>secure_access@birthday:~$</span></div>
        <div style="width: 50px;"></div>
    </div>

    <!-- ЭКРАН ВВОДА ДАТЫ РОЖДЕНИЯ -->
    <div id="accessScreen" class="access-screen">
        <h3>🔒 АВТОРИЗАЦИЯ 🔒</h3>
        <p>Для доступа к поздравлению введите дату рождения</p>
        <input type="text" id="birthCode" class="code-input" placeholder="ДД.ММ.ГГГГ" autocomplete="off">
        <button id="unlockBtn" class="unlock-btn">▶ РАЗБЛОКИРОВАТЬ</button>
        <div id="errorMsg" class="error-msg"></div>
        <div class="hint">
            💡 Формат: ДЕНЬ.МЕСЯЦ.ГОД (например: 00.00.0000 или 00/00/0000 или 00-00-0000)
        </div>
    </div>

    <!-- ОСНОВНОЙ ТЕРМИНАЛ -->
    <div id="terminalWrapper" class="hidden">
        <div class="terminal-body" id="terminalBody">
            <div class="line output">
                <span class="prompt">$></span> <span id="bootMsg">Загрузка поздравления...</span>
            </div>
            <div class="line output ascii-art" id="asciiArea"></div>
            <div id="dynamicOutput"></div>
            <div class="input-line" id="inputLine" style="display: none;">
                <span class="input-prompt">>>></span>
                <input type="text" id="user-input" placeholder="введите 'help' или напишите что-то..." autocomplete="off">
                <button class="send-btn" id="sendBtn">⏎ ENTER</button>
            </div>
            <div class="help-note" id="helpNote">
                💡 <span id="helperText">система готова</span>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const BIRTH_DAY = 10;
        const BIRTH_MONTH = 7;
        const FRIEND_NAME = "Владос";
        
        const accessScreen = document.getElementById('accessScreen');
        const terminalWrapper = document.getElementById('terminalWrapper');
        const birthCodeInput = document.getElementById('birthCode');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsgDiv = document.getElementById('errorMsg');
        
        const terminalBody = document.getElementById('terminalBody');
        const dynamicOutput = document.getElementById('dynamicOutput');
        const inputLineDiv = document.getElementById('inputLine');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('sendBtn');
        const helperSpan = document.getElementById('helperText');
        const asciiArea = document.getElementById('asciiArea');
        const bootMsgSpan = document.getElementById('bootMsg');

        let isPrinting = false;
        let audioCtx = null;
        
        // Функция проверки даты (извлекает день и месяц из любого формата)
        function checkBirthDate(inputValue) {
            if (!inputValue.trim()) return false;
            
            // Ищем первую группу цифр (день) и вторую группу цифр (месяц)
            // Поддерживает: 10.07, 10/07, 10-07, 10.07.1990, 10/07/1990, 10-07-1990
            const matches = inputValue.match(/(\d{1,2})[.\/\-](\d{1,2})/);
            if (!matches) return false;
            
            let day = parseInt(matches[1], 10);
            let month = parseInt(matches[2], 10);
            
            if (isNaN(day) || isNaN(month)) return false;
            if (day < 1 || day > 31) return false;
            if (month < 1 || month > 12) return false;
            
            return (day === BIRTH_DAY && month === BIRTH_MONTH);
        }
        
        function initAudio() {
            if (!audioCtx && window.AudioContext) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playBeep(freq = 880, duration = 0.05, volume = 0.1) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.start();
                osc.stop(now + duration);
            } catch(e) { }
        }
        function playErrorSound() { playBeep(440, 0.3, 0.12); }
        function playSuccessSound() { playBeep(880, 0.15, 0.1); setTimeout(() => playBeep(1200, 0.2, 0.1), 150); }
        function playTypingSound() { playBeep(780 + Math.random() * 120, 0.02, 0.04); }
        function playEnterSound() { playBeep(620, 0.07, 0.08); }
        
        async function typeTextToElement(element, text, speed = 30, sound = true) {
            if (!element) return;
            element.textContent = '';
            for (let i = 0; i < text.length; i++) {
                element.textContent += text[i];
                if (sound && (i % 2 === 0)) playTypingSound();
                await new Promise(r => setTimeout(r, speed));
            }
        }
        
        function addNewLine(type, rawText, withTyping = true, customDelay = 0) {
            return new Promise(async (resolve) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = `line ${type === 'cmd' ? 'cmd' : 'output'}`;
                if (type === 'cmd') {
                    const promptSpan = document.createElement('span');
                    promptSpan.className = 'prompt';
                    promptSpan.textContent = '$> ';
                    lineDiv.appendChild(promptSpan);
                    const cmdSpan = document.createElement('span');
                    cmdSpan.className = 'cmd-text';
                    lineDiv.appendChild(cmdSpan);
                    dynamicOutput.appendChild(lineDiv);
                    if (withTyping) {
                        await typeTextToElement(cmdSpan, rawText, 28, true);
                    } else {
                        cmdSpan.textContent = rawText;
                    }
                } else {
                    const contentSpan = document.createElement('span');
                    contentSpan.style.display = 'inline-block';
                    lineDiv.appendChild(contentSpan);
                    dynamicOutput.appendChild(lineDiv);
                    let processedText = rawText.replace(/\[ИМЯ\]/g, FRIEND_NAME);
                    if (withTyping) {
                        await typeTextToElement(contentSpan, processedText, 32, true);
                    } else {
                        contentSpan.textContent = processedText;
                    }
                }
                terminalBody.scrollTop = terminalBody.scrollHeight;
                if (customDelay) await new Promise(r => setTimeout(r, customDelay));
                resolve();
            });
        }
        
        async function showAsciiArt() {
            asciiArea.innerHTML = '';
            const artBlock = document.createElement('pre');
            artBlock.style.margin = '5px 0';
            artBlock.style.fontFamily = 'monospace';
            asciiArea.appendChild(artBlock);
            const cakeWithName = `
        ██╗  ██╗ █████╗ ██████╗ ██████╗ ██╗   ██╗    ██████╗ ██╗██████╗ ████████╗██╗  ██╗██████╗  █████╗ ██╗   ██╗
        ██║  ██║██╔══██╗██╔══██╗██╔══██╗╚██╗ ██╔╝    ██╔══██╗██║██╔══██╗╚══██╔══╝██║  ██║██╔═╗██╗██╔══██╗╚██╗ ██╔╝
        ███████║███████║██████╔╝██████╔╝ ╚████╔╝     ██████╔╝██║██████╔╝   ██║   ███████║██║ ║██║███████║ ╚████╔╝ 
        ██╔══██║██╔══██║██╔═══╝ ██╔═══╝   ╚██╔╝      ██╔══██╗██║██╔══██╗   ██║   ██╔══██║██╚═╝██║██╔══██║  ╚██╔╝  
        ██║  ██║██║  ██║██║     ██║        ██║       ██████╔╝██║██║  ██║   ██║   ██║  ██║██████╔╝██║  ██║   ██║   
        ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝        ╚═╝       ╚═════╝ ╚═╝╚═╝  ╚═╝   ╚═╝   ╚═╝  ╚═╝╚═════╝ ╚═╝  ╚═╝   ╚═╝   
            `;
            const starWishes = `
        ╔══════════════════════════════════════════════════════════════╗
        ║  SYSTEM.UPTIME:  ${FRIEND_NAME} — ещё один год успешно завершён!     ║
        ║  USER.happiness = INFINITY                                   ║
        ║  Статус: ЛЕГЕНДА 🔥                                          ║
        ╚══════════════════════════════════════════════════════════════╝
        `;
            const fullArt = cakeWithName + "\n" + starWishes;
            await typeTextToElement(artBlock, fullArt, 24, true);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }
        
        async function loadGreetingSequence() {
            isPrinting = true;
            await showAsciiArt();
            await new Promise(r => setTimeout(r, 50));
            
            if (bootMsgSpan) {
                await typeTextToElement(bootMsgSpan, `Загрузка персонального поздравления для ${FRIEND_NAME}... [OK]`, 30, true);
            }
            await new Promise(r => setTimeout(r, 400));
            
            const messages = [
                { type: "cmd", text: `grep -i "birthday_legend" /dev/heart/${FRIEND_NAME}`, delay: 400 },
                { type: "output", text: `[FOUND] Особенный день: ${FRIEND_NAME} празднует День Рождения! Статус: ГЛАВНЫЙ ИМЕНИННИК 🎯`, delay: 500 },
                { type: "cmd", text: `./celebrate --user = ${FRIEND_NAME} --level = epic --hugs = ∞`, delay: 500 },
                { type: "output", text: `⚡ Активирован протокол "Именинник". Генерирую тёплые пожелания...`, delay: 350 },
                { type: "output", text: `✨ [ИМЯ], пусть каждый день твоей жизни будет ярче предыдущего, словно обновление до новой версии счастья!`, delay: 700 },
                { type: "output", text: `🎁 Желаю тебе: оставаться собой, достигать любых вершин, радоваться мелочам и знать, что ты — крутой друг! 🤜🤛`, delay: 800 },
                { type: "output", text: `💾 Пусть в твоём "ядре" царит гармония, здоровье будет крепким, а удача сопровождает каждый процесс.`, delay: 700 },
                { type: "cmd", text: `fortune | grep "${FRIEND_NAME}" --wishes`, delay: 500 }
            ];
            
            for (const msg of messages) {
                await addNewLine(msg.type, msg.text, true, msg.delay || 300);
                await new Promise(r => setTimeout(r, 150));
            }
            
            await addNewLine("output", `🎈🎁 С ДНЁМ РОЖДЕНИЯ, ${FRIEND_NAME.toUpperCase()}! 🎁🎈 Пусть сбудутся самые смелые мечты, кошелёк всегда будет полон, а настроение — на максималках.`, true, 600);
            await addNewLine("cmd", `./wishes --send hug --candles = ∞ --to = ${FRIEND_NAME}`, true, 350);
            await addNewLine("output", `❤️ Желаю тебе море счастья, крутых приключений и чтобы каждый день был как праздник! ❤️`, true, 550);
            
            await addNewLine("output", "─────────────────────────────────────────────────────────", false);
            await addNewLine("output", "✨ ИНТЕРАКТИВНЫЙ РЕЖИМ: теперь ты можешь вводить команды ✨", true, 450);
            await addNewLine("cmd", "help — показать список доступных команд", false);
            await new Promise(r => setTimeout(r, 300));
            isPrinting = false;
            inputLineDiv.style.display = "flex";
            userInput.focus();
            helperSpan.innerHTML = `💬 Напиши что-нибудь: 'help', 'торт', 'пожелание', 'музыка', 'спасибо'`;
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }
        
        function processCommand(cmdText) {
            if (!cmdText.trim()) return;
            const lower = cmdText.trim().toLowerCase();
            addNewLine("cmd", cmdText, false, 0).then(() => {
                let response = "";
                if (lower === "help" || lower === "?") {
                    response = `📟 Доступные команды: 'help', 'торт', 'пожелание', 'музыка', 'спасибо', 'clear' (очистить экран). Также можно написать что угодно от души!`;
                } 
                else if (lower === "торт" || lower.includes("торт")) {
                    response = `🍰🎂 Виртуальный кусочек торта для ${FRIEND_NAME} с кремом из улыбок и ягодами счастья! Пусть настоящий будет ещё вкуснее! 🍒🥳`;
                    playBeep(660, 0.18, 0.1);
                }
                else if (lower === "пожелание") {
                    response = `💫 ${FRIEND_NAME}, желаю тебе океан драйва, горы достижений и бездну хорошего настроения! С днём варенья! 🎂✨`;
                }
                else if (lower === "музыка") {
                    response = `🔊 Врубаю поздравлятельный бит для ${FRIEND_NAME}! 🥁🎹 Пусть жизнь танцует в ритме счастья!`;
                    playBeep(523, 0.2, 0.12);
                    setTimeout(()=> playBeep(587, 0.2, 0.12), 200);
                    setTimeout(()=> playBeep(659, 0.25, 0.12), 420);
                }
                else if (lower === "спасибо") {
                    response = `❤️ Пожалуйста! ${FRIEND_NAME} заслуживает только самых крутых поздравлений! (◕‿◕)`;
                }
                else if (lower === "clear") {
                    while (dynamicOutput.firstChild) dynamicOutput.removeChild(dynamicOutput.firstChild);
                    response = `✨ Экран динамических сообщений очищен. Основной баннер с именем ${FRIEND_NAME} остался. Продолжай :)`;
                    addNewLine("output", response, true, 0);
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    return;
                }
                else {
                    response = `💬 Твоё сообщение: "${cmdText.trim()}" — Пусть всё сказанное вернётся к тебе бумерангом счастья, ${FRIEND_NAME}! 🌈 С днём рождения!`;
                    if (cmdText.trim().length > 2) playBeep(450, 0.07, 0.07);
                }
                addNewLine("output", response, true, 130);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }).catch(console.warn);
            userInput.value = "";
            userInput.focus();
        }
        
        function onSend() {
            if (isPrinting) {
                helperSpan.innerHTML = "⏳ Подожди, терминал загружает поздравление...";
                playBeep(380, 0.1, 0.08);
                return;
            }
            const val = userInput.value;
            if (!val.trim()) {
                playBeep(400, 0.06, 0.08);
                helperSpan.innerHTML = `💬 Напиши что-нибудь, например: 'пожелание' или 'торт'`;
                return;
            }
            playEnterSound();
            processCommand(val);
        }
        
        function handleUnlock() {
            initAudio();
            const inputValue = birthCodeInput.value;
            if (checkBirthDate(inputValue)) {
                playSuccessSound();
                errorMsgDiv.innerHTML = "✅ ДОСТУП РАЗРЕШЁН! Загрузка поздравления... ✅";
                errorMsgDiv.style.color = "#33ff33";
                setTimeout(() => {
                    accessScreen.classList.add('hidden');
                    terminalWrapper.classList.remove('hidden');
                    loadGreetingSequence().catch(console.error);
                }, 600);
            } else {
                playErrorSound();
                errorMsgDiv.innerHTML = "❌ НЕВЕРНАЯ ДАТА! Доступ запрещён. Попробуйте ещё раз. ❌";
                errorMsgDiv.style.color = "#ff4444";
                birthCodeInput.value = "";
                birthCodeInput.focus();
            }
        }
        
        unlockBtn.addEventListener('click', handleUnlock);
        birthCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleUnlock();
            }
        });
        
        sendBtn.addEventListener('click', onSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                onSend();
            }
        });
        
        document.body.addEventListener('click', function initOnce() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });
        
        birthCodeInput.focus();
    })();
</script>
</body>
</html>
