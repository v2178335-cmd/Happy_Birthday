<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАЗ-2107 | Подарок</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #controls { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; z-index: 20; }
        .btn { padding: 10px 18px; background: rgba(30,30,40,0.85); backdrop-filter: blur(4px); border: 1px solid #444; color: #eee; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; width: 180px; text-align: left; }
        .btn:hover { background: rgba(60,60,80,0.9); }
        .btn.active { background: #2a6b2a; border-color: #4caf50; }
        .btn.lights { background: rgba(255,152,0,0.2); border-color: #ff9800; }
        .btn.lights.active { background: rgba(255,87,34,0.4); border-color: #ff5722; }
        .btn.reset { text-align: center; }

        #status-panel { position: absolute; top: 25px; left: 25px; z-index: 20; background: rgba(0,0,0,0.75); padding: 12px 24px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; font-weight: 500; color: white; font-size: 16px; }
        #status-icon { font-size: 20px; }
        #status-text { letter-spacing: 0.3px; }
        #info { position: absolute; bottom: 30px; left: 30px; z-index: 20; color: #aaa; font-size: 13px; }
    </style>
</head>
<body>
    <div id="status-panel">
        <div id="status-icon">🎉</div>
        <span id="status-text">С днём рождения, Друг! 🎂</span>
    </div>
    <div id="controls">
        <button class="btn" data-action="doorL">🚪 Левая дверь</button>
        <button class="btn" data-action="doorR">🚪 Правая дверь</button>
        <button class="btn" data-action="hood">🔧 Капот</button>
        <button class="btn" data-action="trunk">🧳 Багажник</button>
        <button class="btn" data-action="engine" style="background: rgba(0, 255, 100, 0.2); border-color: #00cc66;">🔄 Завести двигатель</button>
        <button class="btn lights" data-action="lights">💡 Фары</button>
        <button class="btn" data-action="turnLeft" style="background: rgba(255, 100, 0, 0.2); border-color: #ff6600;">🚨 Аварийка</button>
        <button class="btn reset" data-action="reset">↺ Сбросить всё</button>
    </div>
    <div id="info">ВАЗ-2107 | Вращай, крути, нажимай</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(8, 4.5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);
        controls.update();

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.environment = envTexture;
        
        const light = new THREE.DirectionalLight(0xffffff, 2.0);
        light.position.set(10, 20, 10);
        light.castShadow = true;
        light.shadow.mapSize.width = 2048;
        light.shadow.mapSize.height = 2048;
        scene.add(light);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
        fillLight.position.set(-10, 5, -15);
        scene.add(fillLight);

        const groundMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.9 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(20, 20, 0x446688, 0x223355);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const state = {
            doorL: 0, doorR: 0, hood: 0, trunk: 0,
            lights: false, turn: 0,
            engine: 0
        };
        const current = {
            doorL: 0, doorR: 0, hood: 0, trunk: 0,
            engine: 0
        };

        const statusIcon = document.getElementById('status-icon');
        const statusText = document.getElementById('status-text');

        function updateStatus() {
            if (state.turn === 1) { statusIcon.textContent = '🚨'; statusText.textContent = 'Аварийка'; }
            else if (state.lights) { statusIcon.textContent = '💡'; statusText.textContent = 'Фары включены'; }
            else if (state.engine) { statusIcon.textContent = '🔊'; statusText.textContent = 'Двигатель заведён'; }
            else { statusIcon.textContent = '🎉'; statusText.textContent = 'С днём рождения, Друг! 🎂'; }
        }

        const loader = new GLTFLoader();
        let carGroup = new THREE.Group();
        scene.add(carGroup);

        const beam1 = new THREE.SpotLight(0xffeedd, 0);
        beam1.position.set(0.6, 0.6, 0);
        beam1.angle = 0.4; 
        beam1.penumbra = 0.3; 
        beam1.distance = 40;
        beam1.target.position.set(0.6, 0, 10); 
        beam1.castShadow = true;
        beam1.shadow.mapSize.width = 1024;
        beam1.shadow.mapSize.height = 1024;
        beam1.shadow.bias = 1;
        scene.add(beam1);
        scene.add(beam1.target);

        const beam2 = new THREE.SpotLight(0xffeedd, 0);
        beam2.position.set(-0.6, 0.6, 0);
        beam2.angle = 0.4; 
        beam2.penumbra = 0.3; 
        beam2.distance = 40;
        beam2.target.position.set(-0.6, 0, 10); 
        beam2.castShadow = true;
        beam2.shadow.mapSize.width = 1024;
        beam2.shadow.mapSize.height = 1024;
        beam2.shadow.bias = 1;
        scene.add(beam2);
        scene.add(beam2.target);

        loader.load(
            'vaz.glb',
            function (gltf) {
                const model = gltf.scene;
                model.position.y = 0.85; 
                model.position.z = -1.2;
                model.rotation.y = -3.15;
                
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.name === 'base_povorotniki_0') {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0xff5500,
                                emissive: 0x700900,
                                emissiveIntensity: 0
                            });
                        }
                        if (child.name === 'base_Fari_0') {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0xffffff,
                                emissive: 0x010839,
                                emissiveIntensity: 0
                            });
                        }
                        if (child.name === 'base_f_0') {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0xffffff,
                                emissive: 0x010839,
                                emissiveIntensity: 0
                            });
                        }
                        if (child.name === 'base_k_0') {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0xff5500,
                                emissive: 0x700900,
                                emissiveIntensity: 0
                            });
                        }
                        if (child.isMesh && child.name.includes('BaseColorCuzov')) {
                            child.material.color.setHex(0xffffff);
                            child.material.emissive.setHex(0x000000);
                            child.material.roughness = 0.25;
                            child.material.metalness = 0.6;
                        }
                    }
                });

                carGroup.add(model);
                updateStatus();
            },
            undefined,
            function (error) {
                console.error('Ошибка загрузки vaz.glb:', error);
                statusIcon.textContent = '❌';
                statusText.textContent = 'Ошибка файла!';
            }
        );

        function findDeep(group, name) {
            let result = null;
            group.traverse((child) => {
                if (child.name === name) {
                    result = child;
                }
            });
            return result;
        }

        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.15;
            current.doorL += (state.doorL - current.doorL) * speed;
            current.doorR += (state.doorR - current.doorR) * speed;
            current.hood += (state.hood - current.hood) * speed;
            current.trunk += (state.trunk - current.trunk) * speed;
            current.engine += (state.engine - current.engine) * speed;

            const doorL = findDeep(carGroup, 'Object_32');
            const doorR = findDeep(carGroup, 'Object_65');
            const hood = findDeep(carGroup, 'kapot');
            const trunk = findDeep(carGroup, 'bag');
            const fari = findDeep(carGroup, 'base_Fari_0');
            const f_0 = findDeep(carGroup, 'base_f_0');
            const k_0 = findDeep(carGroup, 'base_k_0');
            const povorotniki = findDeep(carGroup, 'base_povorotniki_0');
            
            const wFL = findDeep(carGroup, 'Wheel_L_P');
            const wFR = findDeep(carGroup, 'Wheel_L_Z');
            const wRL = findDeep(carGroup, 'Wheel_P_P');
            const wRR = findDeep(carGroup, 'Wheel_P_Z');

            if (doorL) {
                doorL.rotation.z = 3.14 - (current.doorL * -1.2); 
            }
            if (doorR) {
                doorR.rotation.z = 3.14 + (current.doorR * -1.2);
                doorR.position.x = 0.059 + (current.doorR * -0.025);
                doorR.position.z = 0 + (current.doorR * 0.05);
            }

            if (hood) hood.rotation.x = current.hood * 0.9;
            if (trunk) trunk.rotation.x = current.trunk * 0.9;

            if (current.engine > 0.01) {
                const spinSpeed = 0.5 * current.engine; 
                if (wFL) wFL.rotation.x -= spinSpeed;
                if (wFR) wFR.rotation.x -= spinSpeed;
                if (wRL) wRL.rotation.x -= spinSpeed;
                if (wRR) wRR.rotation.x -= spinSpeed;
            }

            const intensity = state.lights ? 3.0 : 0;
            if (fari && fari.material) fari.material.emissiveIntensity = intensity;
            if (f_0 && f_0.material) f_0.material.emissiveIntensity = intensity;
            if (k_0 && k_0.material) k_0.material.emissiveIntensity = intensity;
            
            beam1.intensity = state.lights ? 25 : 0;
            beam2.intensity = state.lights ? 25 : 0;

            const blink = Math.sin(Date.now() / 350) > 0 ? 5.0 : 0; 
            if (state.turn === 1 || state.turn === 2) {
                if (povorotniki && povorotniki.material) {
                    povorotniki.material.emissiveIntensity = blink;
                }
            } else {
                if (povorotniki && povorotniki.material) {
                    povorotniki.material.emissiveIntensity = 0;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Запускаем анимацию сразу при загрузке
        animate();

        // Кнопки управления
        document.querySelectorAll('#controls .btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                switch(action) {
                    case 'doorL': state.doorL = state.doorL === 0 ? 1 : 0; btn.classList.toggle('active'); break;
                    case 'doorR': state.doorR = state.doorR === 0 ? 1 : 0; btn.classList.toggle('active'); break;
                    case 'hood': state.hood = state.hood === 0 ? 1 : 0; btn.classList.toggle('active'); break;
                    case 'trunk': state.trunk = state.trunk === 0 ? 1 : 0; btn.classList.toggle('active'); break;
                    case 'engine': state.engine = state.engine === 0 ? 1 : 0; btn.classList.toggle('active'); break;
                    case 'lights': state.lights = !state.lights; btn.classList.toggle('active'); if (state.lights && state.turn !== 0) state.turn = 0; break;
                    case 'turnLeft': if (state.turn === 1) state.turn = 0; else state.turn = 1; btn.classList.toggle('active'); break;
                    case 'turnRight': if (state.turn === 2) state.turn = 0; else state.turn = 2; btn.classList.toggle('active'); break;
                    case 'reset':
                        state.doorL = 0; state.doorR = 0; state.hood = 0; state.trunk = 0;
                        state.lights = false; state.turn = 0; state.engine = 0;
                        document.querySelectorAll('#controls .btn').forEach(b => b.classList.remove('active'));
                        break;
                }
                updateStatus();
            });
        });
    </script>
</body>
</html>
